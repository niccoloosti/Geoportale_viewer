<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Geoportale vincoli – Prototipo</title>
  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxaOJbHllN+hmNHzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9CooQqIjJZRGuk2/Z9VM+NkiqVN1lvTLZBo="
    crossorigin=""
  ></script>
</head>

<body>
  <div id="layerControl">
    <h3>Layer</h3>

    <label>
      <input type="checkbox" id="toggleNatura2000">
      Rete Natura 2000 – Italia
    </label>

    <label>
      <input type="checkbox" id="toggleUSA">
      Demo Stati USA
    </label>

    <label>
      <input type="checkbox" id="toggleRaster">
      Demo raster
    </label>

    <label>
      <input type="checkbox" id="toggleIBA">
      Aree IBA – Important Bird Areas (PCN)
    </label>
  </div>

  <div id="map"></div>

  <script src="main.js"></script>

</html>
