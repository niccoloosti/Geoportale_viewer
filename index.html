<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Geoportale vincoli – 1.2v_Geo</title>

  <!-- Leaflet SENZA integrity/crossorigin per evitare blocchi -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS inline -->
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
      color: #222;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      right: 0;
      left: 280px; /* spazio per la sidebar */
      background: #e5e7eb; /* per vedere subito il contenitore */
    }

    #sidebar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      padding: 16px 18px;
      background: #f6f7f9;
      border-right: 1px solid #d0d4dc;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-header h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .version-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #111827;
      color: #ffffff;
      letter-spacing: 0.03em;
    }

    .subtitle {
      margin: 6px 0 12px 0;
      font-size: 12px;
      color: #4b5563;
    }

    .section {
      margin-top: 10px;
      margin-bottom: 16px;
    }

    .section h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #6b7280;
    }

    .section h3 {
      font-size: 12px;
      font-weight: 600;
      margin: 0 0 4px 0;
      color: #4b5563;
    }

    .section p {
      margin: 0;
      font-size: 12px;
      color: #6b7280;
    }

    .layer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      padding: 5px 6px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .layer-row:hover {
      background: #e5e7eb;
    }

    .layer-row input[type="checkbox"] {
      width: 14px;
      height: 14px;
    }

    .footer {
      margin-top: auto;
      font-size: 11px;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
      padding-top: 8px;
    }
  </style>
</head>

<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Geoportale vincoli</h1>
      <span class="version-badge">1.2v_Geo</span>
    </div>

    <p class="subtitle">
      Prototipo WebGIS – consultazione vincoli nazionali da servizi WMS.
    </p>

    <div class="section">
      <h2>Layer vincoli</h2>

      <label class="layer-row">
        <input type="checkbox" id="toggleNatura2000" />
        <span>Rete Natura 2000 – Italia (PCN)</span>
      </label>

      <label class="layer-row">
        <input type="checkbox" id="toggleIBA" />
        <span>Aree IBA – Important Bird Areas (PCN)</span>
      </label>
    </div>

    <div class="section">
      <h3>Sorgente dati</h3>
      <p>Geoportale Nazionale / Ministero dell’Ambiente – servizi WMS ufficiali.</p>
    </div>

    <div class="footer">
      <span>Prototype build 1.2v_Geo</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="main.js"></script>
</body>
</html>
