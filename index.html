<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Geoportale vincoli – 1.2v_Geo</title>
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTLZBo="
    crossorigin=""
  ></script>
</head>

<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>Geoportale vincoli</h1>
      <span class="version-badge">1.2v_Geo</span>
    </div>

    <p class="subtitle">
      Prototipo WebGIS – consultazione vincoli nazionali da servizi WMS.
    </p>

    <div class="section">
      <h2>Layer vincoli</h2>

      <label class="layer-row">
        <input type="checkbox" id="toggleNatura2000" />
        <span>Rete Natura 2000 – Italia (PCN)</span>
      </label>

      <label class="layer-row">
        <input type="checkbox" id="toggleIBA" />
        <span>Aree IBA – Important Bird Areas (PCN)</span>
      </label>
    </div>

    <div class="section info">
      <h3>Sorgente dati</h3>
      <p>Geoportale Nazionale / Ministero dell’Ambiente – servizi WMS ufficiali.</p>
    </div>

    <div class="footer">
      <span>Prototype build 1.2v_Geo</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="main.js"></script>
</body>
</html>
